<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>shot harness</title>
<style>
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
  iframe { border: 0; width: 100%; height: 100%; display: block; }
</style>
</head>
<body>
<iframe id="f" src="../index.html"></iframe>
<script>
// Drives the REAL game (inside the iframe) straight into the requested state
// through its own event bus, then leaves it running so --screenshot captures
// a live frame. Pure verification tooling; nothing here ships in the game.
(function () {
  var q = {};
  location.search.replace(/[?&]+([^=&]+)=([^&]*)/g, function (m, k, v) { q[k] = decodeURIComponent(v); });
  var state = q.state || 'match';
  var time = q.time || 'day';
  var court = q.court || '';
  var DBG = null;
  var f = document.getElementById('f');
  var busy = false;
  var T0 = Date.now();

  function stage(label) {
    // shot.js polls window.__shotStage on THIS frame; keep the iframe copy too
    try { window.__shotStage = label; } catch (e) {}
    try { f.contentWindow.__shotStage = label; } catch (e) {}
    console.log('STAGE:' + label);
  }

  function wait(test, cb, tag) {
    var n = 0;
    (function poll() {
      var ok = false;
      try { ok = test(); } catch (e) { ok = false; }
      if (ok) { stage(tag || 'ready'); cb(); return; }
      if (++n > 600) { stage('TIMEOUT:' + (tag || '')); return; }
      setTimeout(poll, 20);
    })();
  }

  function booted() {
    var w = f.contentWindow;
    if (!w || !w.LG || !w.LG.eventBus) return false;
    var d = f.contentDocument;
    var lo = d && d.getElementById('loading-overlay');
    return !!(lo && lo.classList.contains('hidden'));
  }

  // Two samples, 1.6s apart, of the live squads: which body each player
  // got, whether the mixer clock is advancing (real animation), the state
  // it is in, and the two y values that prove the figure is standing on
  // the deck (gameplay y and the node y the group is written with).
  // One line per player, both squads: which body, the authored facing vs the
  // rotation the group is actually drawn with, the gameplay velocity, and the
  // controller state + mixer clock. Match state comes first. Used to prove the
  // kickoff lines up looking at the ball and that nobody keeps running while
  // the match is frozen after a goal.
  function matchSnap() {
    var LGw = f.contentWindow, LG = LGw && LGw.LG;
    var m = LG && LG.Match;
    if (!m) return 'state=? (no match)';
    var out = [];
    var teams = [m.home, m.away];
    for (var t = 0; t < teams.length; t++) {
      var arr = teams[t] || [];
      for (var i = 0; i < arr.length; i++) {
        var p = arr[i], md = p && p.model;
        if (!p) continue;
        var st = md && md.anim ? md.anim.state() : null;
        var sp = Math.sqrt((p.vx || 0) * (p.vx || 0) + (p.vz || 0) * (p.vz || 0));
        out.push((t ? 'A' : 'H') + i +
          (md && md.skinned ? ' rig' : ' proc') +
          ' y=' + p.y + '/' + (md ? md.group.position.y.toFixed(3) : '-') +
          ' f=' + Number(p.facing).toFixed(2) +
          ' r=' + Number(md && md.group ? md.group.rotation.y : 0).toFixed(2) +
          ' v=' + sp.toFixed(2) +
          ' t=' + (st ? Number(st.time).toFixed(2) : '-') +
          ' s=' + (st ? st.cur : '-'));
      }
    }
    return 'state=' + m.state + ' ' + out.join(' | ');
  }

  // ?crowd=1 — DIAGNOSIS ONLY: cost of the stands crowd. Hides every crowd
  // group (bleachers, side seats, perimeter railing, instanced crowd), samples
  // renderer.info + scene mesh count + average frame time both ways, then
  // restores visibility. Nothing about the crowd itself is changed.
  function crowdProbe() {
    var LGw = f.contentWindow, LG = LGw.LG;
    var dbg = LG && LG.debug;
    var r = dbg && dbg.renderer, arena = dbg && dbg.arena, scene = dbg && dbg.scene;
    if (!r || !arena) { console.log('CROWD no renderer/arena ref'); stage('done'); return; }
    var NAMED = ['bleacher-1', 'bleacher+1', 'sideSpect+1', 'sideSpect-1', 'perimeterSpect', 'crowd'];
    var IDX = [4, 5, 6, 7, 18];   // fallback if the arena groups carry no name
    function settle(cb) {
      requestAnimationFrame(function () {
        requestAnimationFrame(function () { setTimeout(cb, 60); });
      });
    }
    // CPU+GPU cost of a frame: render N times back-to-back and gl.finish() so
    // the number reflects draw-call/submission cost, not rAF throttling.
    function bench(n) {
      var sc = dbg.scene, cam = dbg.camera;
      if (!sc || !cam) return -1;
      var gl = r.getContext();
      for (var i = 0; i < n; i++) r.render(sc, cam);
      if (gl && gl.finish) gl.finish();
      return 0;
    }
    function sceneStats() {
      var m = 0, t = 0, vis = 0;
      if (scene) scene.traverse(function (o) {
        if (o.isMesh) { m++; if (o.visible) vis++; }
        if (o.isInstancedMesh) t += 1;
      });
      // per-arena-child mesh counts — tells which block a scene delta came from
      var kids = [];
      if (arena && arena.children) arena.children.forEach(function (c, i) {
        var n = 0;
        c.traverse(function (o) { if (o.isMesh) n++; });
        kids.push((c.name || ('ch' + i)) + ':' + n);
      });
      return { meshes: m, visibleMeshes: vis, arena: kids.join(' ') };
    }
    settle(function () {
      var withC = r.info.render.calls, withT = r.info.render.triangles;
      var st = sceneStats();
      var t0 = performance.now(); bench(12);
      var withMs = (performance.now() - t0) / 12;
      var groups = [], i;
      for (i = 0; i < NAMED.length; i++) {
        var g = arena.children.find(function (c) { return c.name === NAMED[i]; });
        if (!g && arena.children[IDX[i]]) g = arena.children[IDX[i]];
        if (g) groups.push(g);
      }
      var crowdMeshes = 0, crowdInst = 0;
      groups.forEach(function (g) {
        g.visible = false;
        g.traverse(function (o) {
          if (o.isMesh) crowdMeshes++;
          if (o.isInstancedMesh) crowdInst++;
        });
      });
      settle(function () {
        var noC = r.info.render.calls, noT = r.info.render.triangles;
        var t1 = performance.now(); bench(12);
        var noMs = (performance.now() - t1) / 12;
        console.log('CROWD groups=' + groups.length + ' meshes=' + crowdMeshes +
          ' instanced=' + crowdInst + ' sceneMeshes=' + st.meshes +
          ' calls with=' + withC + ' without=' + noC + ' saved=' + (withC - noC) +
          ' (' + (withC ? Math.round(100 * (withC - noC) / withC) : 0) + '%)' +
          ' tris with=' + withT + ' without=' + noT +
          ' renderMs with=' + withMs.toFixed(2) + ' without=' + noMs.toFixed(2) +
          ' textures=' + r.info.memory.textures + ' geometries=' + r.info.memory.geometries +
          '\nCROWD arena[' + st.arena + ']');
        groups.forEach(function (g) { g.visible = true; });
        stage('done');
      });
    });
  }

  function diagMatch() {
    try { console.log('MATCHDIAG A ' + matchSnap()); } catch (e) { console.log('MATCHDIAG err ' + e.message); }
    setTimeout(function () {
      try { console.log('MATCHDIAG B ' + matchSnap()); } catch (e) { console.log('MATCHDIAG err ' + e.message); }
    }, 1600);
  }

  // ?goal=1 — let the squads run, then park the ball in the away net so a
  // real goal fires (same checkGoal path the game uses), and sample the
  // whole GOAL window: frozen players must not keep running in place.
  // done() is called once the state is GOAL so the screenshot lands there.
  function goalProbe(done) {
    var LGw = f.contentWindow, LG = LGw.LG;
    if (LG) watchCrowdEvents(LG);
    var m = LG && LG.Match;
    if (!m) { console.log('GOALFORCE no match'); done(); return; }
    // one real shot through the match's own path: proves the crowd's shoot
    // listener (the forced goal below emits 'goal' but never 'shoot')
    setTimeout(function () {
      try {
        var shooters = (m.away || []).concat(m.home || [])
          .filter(function (pp) { return pp && !pp.isGoalkeeper; });
        if (shooters[0] && m.shootDirect && m.enemyGoal) {
          m.shootDirect(shooters[0], 0.9, m.enemyGoal(shooters[0].team), {});
          console.log('GOALFORCE synthetic shot fired');
        }
      } catch (e) { console.log('GOALFORCE shoot err ' + e.message); }
    }, 400);
    var placed = false, snapped = 0, beats = 0, sawGoal = false, finished = false;
    var lastCel = '';
    var cinLast = false, cinSeen = false, cinFinished = false;
    function vmax() {
      var all = (m.home || []).concat(m.away || []), best = 0;
      for (var i = 0; i < all.length; i++) {
        var v = Math.sqrt(all[i].vx * all[i].vx + all[i].vz * all[i].vz);
        if (v > best) best = v;
      }
      return best;
    }
    function finish(tag) {
      if (finished) return;
      finished = true;
      console.log('GOALFORCE ' + tag + ' cin=' + (!cinSeen ? 'never-started' : (cinFinished ? 'finished' : 'STUCK')));
      done();
    }
    var iv = setInterval(function () {
      var v = vmax();
      if (!placed) {
        if (beats++ < 60) console.log('GOALFORCE beat ' + beats + ' state=' + m.state + ' vmax=' + v.toFixed(2));
        if (m.state !== 'PLAY' || v < 1.5) return;
        var C = LG.Config.court, halfL = C.length / 2;
        m.ball.x = 0; m.ball.y = 0.3; m.ball.z = -halfL - 0.55;
        m.ball.vx = m.ball.vy = m.ball.vz = 0;
        // credit a home outfielder: that net is the away goal, so team 0
        // scores with a real scorer — the celebration paths that translate
        // (gather nudges, slide travel) all get exercised
        var kickers = (m.home || []).filter(function (pp) { return pp && !pp.isGoalkeeper; });
        m.ball.lastKicker = kickers[0] || (m.home || [])[0] || null;
        placed = true;
        console.log('GOALFORCE placed in PLAY');
        return;
      }
      snapped++;
      var cs = LG.Crowd && LG.Crowd.stats;
      console.log('GOALSNAP ' + snapped + ' ' + matchSnap() +
        (cs ? ' crowd=cheer:' + (cs.cheer || 0).toFixed(2) + ' arm:' + (cs.arm0 || 0).toFixed(2) : ' crowd=-'));
      if (m.state === 'GOAL') sawGoal = true;
      var cel = LG.Celebration && LG.Celebration.current;
      if (cel && cel.type !== lastCel) { lastCel = cel.type; console.log('GOALFORCE celeb type=' + cel.type + ' dur=' + cel.dur.toFixed(2)); }
      if (cel && cel.scorer) {
        console.log('GOALFORCE scorer x=' + cel.scorer.x.toFixed(2) + ' z=' + cel.scorer.z.toFixed(2) +
          ' v=' + Math.sqrt(cel.scorer.vx * cel.scorer.vx + cel.scorer.vz * cel.scorer.vz).toFixed(2));
      }
      // goal cinematic: prove it started, ran a camera move and handed back
      var G = LG.GoalCinematic;
      if (G && G.state) {
        var gs = G.state();
        if (gs.active && !cinLast) { cinSeen = true; console.log('CINSTART t=' + gs.t.toFixed(2) + ' dur=' + gs.dur.toFixed(2)); }
        if (gs.active) {
          var cpos = m.camera && m.camera.camera && m.camera.camera.position;
          console.log('CINSNAP ' + snapped + ' t=' + gs.t.toFixed(2) + ' w=' + gs.w.toFixed(2) +
            (cpos ? ' cam=(' + cpos.x.toFixed(1) + ',' + cpos.y.toFixed(1) + ',' + cpos.z.toFixed(1) + ')' : ' cam=-'));
        } else if (cinLast) {
          var mc = m.camera;
          cinFinished = true;
          console.log('CINHAND follow=(' + (mc ? mc.followX.toFixed(2) : '-') + ',' + (mc ? mc.followZ.toFixed(2) : '-') +
            ') pulse=' + (mc ? mc.zoomPulse.toFixed(2) : '-'));
        }
        cinLast = gs.active;
      } else {
        console.log('CINMISS module absent');
      }
      // capture only once the celebration has run AND real play is moving
      // again — that single pass proves the freeze and the resumption
      if (sawGoal && m.state === 'PLAY' && v > 1.5) {
        clearInterval(iv);
        finish('resumed in PLAY vmax=' + v.toFixed(2));
        return;
      }
      if (snapped > 60) {
        clearInterval(iv);
        finish((sawGoal ? 'no PLAY after the goal' : 'never scored') + ' state=' + m.state);
      }
    }, 250);
  }

  // Wrap LG.Models.animateChar so the log can prove which bodies still
  // go through the limb maths. The Phase-2 GLB controller must never land
  // here: c.glb stays 0 for the whole run.
  function watchAnimateChar(LG) {
    var c = { glb: 0, proc: 0, orig: LG.Models.animateChar };
    LG.Models.animateChar = function () {
      var m = arguments[0];
      if (m && (m.glb || m.glbShim)) c.glb++; else c.proc++;
      return c.orig.apply(this, arguments);
    };
    return c;
  }

  // Logs the crowd's own reaction-timer state when goal/shoot fire, so a
  // probe run proves the crowd wired to the event bus (audio is gated by
  // the AudioContext, which headless runs keep suspended).
  function watchCrowdEvents(LG) {
    if (!LG.eventBus || !LG.eventBus.on) return;
    LG.eventBus.on('goal', function () {
      var s = LG.Crowd && LG.Crowd.stats;
      console.log('CROWDEVT goal cheer=' + (s ? s.cheer.toFixed(2) : '-'));
    });
    LG.eventBus.on('shoot', function (ev) {
      var s = LG.Crowd && LG.Crowd.stats;
      var p = ev && typeof ev.power === 'number' ? ev.power : -1;
      console.log('CROWDEVT shoot power=' + p.toFixed(2) +
        ' swell=' + (s ? s.swell.toFixed(2) : '-'));
    });
  }

  // TEMPORARY live-match rig probe: answers "is the rig the thing being
  // drawn, and does the state machine actually leave idle?" by sampling
  // TEMPORARY live-match rig probe: drives the human through
  // idle -> jog -> run -> sprint -> kick -> stop -> idle -> turn and
  // records which controller states the GLB body actually reported.
  function rigProbe() {
    var LG = f.contentWindow.LG;
    var watcher = watchAnimateChar(LG);
    watchCrowdEvents(LG);

    // ?closeup=1 — ride the game's own camera close to the human (the
    // Phase-1 test player) so the final frame shows THAT body in play
    if (q.closeup) {
      var dbg = LG.debug;
      if (dbg && dbg.renderer) {
        var r2 = dbg.renderer, origRender = r2.render, gp = null;
        r2.render = function (sc, cm) {
          if (!gp && LG.Match && LG.Match.home) {
            for (var i = 0; i < LG.Match.home.length; i++) {
              if (LG.Match.home[i] && LG.Match.home[i].glbModel) { gp = LG.Match.home[i]; break; }
            }
          }
          if (cm && gp && typeof gp.x === 'number') {
            cm.position.set(gp.x + 2.6, 1.8, gp.z + 3.0);
            cm.lookAt(gp.x, 1.0, gp.z);
            cm.updateMatrixWorld(true);
          }
          return origRender.call(r2, sc, cm);
        };
        console.log('RIGPROBE closeup camera armed');
      }
    }

    // ---- the Phase-2 GLB test player (home slot 0) ----
    function glbPlayer() {
      var teams = [LG.Match && LG.Match.home, LG.Match && LG.Match.away];
      for (var t = 0; t < 2; t++) {
        var arr = teams[t] || [];
        for (var i = 0; i < arr.length; i++) {
          var p = arr[i];
          if (p && p.model && p.model.glb) return p;
        }
      }
      return null;
    }

    // joystick geometry, measured live so the same numbers work at any
    // window size (input.js: fullR = clamp(halfW * 0.58, 34, 84))
    function joyGeom() {
      var d = f.contentDocument;
      var zone = d.getElementById('joystick-zone');
      if (!zone) return null;
      var r = zone.getBoundingClientRect();
      var T = LG.Config.touch || {};
      var dead = T.stickDeadZone != null ? T.stickDeadZone : 7;
      var frac = T.stickFullTilt != null ? T.stickFullTilt : 0.58;
      var fullR = Math.max(T.stickFullMin || 34, Math.min(T.stickFullMax || 84, (r.width / 2) * frac));
      return { zone: zone, cx: r.left + r.width / 2, cy: r.top + r.height / 2, dead: dead, fullR: fullR };
    }

    // input.js eases the stick with m*(1.16-0.16m); invert it so a step
    // can ask for an exact stick magnitude (= fraction of top speed)
    function rawOf(E) {
      E = Math.max(0, Math.min(1, Number(E) || 0));
      var disc = 1.16 * 1.16 - 0.64 * E;
      return (1.16 - Math.sqrt(Math.max(0, disc))) / 0.32;
    }

    // drive(E, ux, uy): E = stick magnitude 0..1, (ux,uy) = direction.
    // E = 0 releases the stick (player coasts down to a stop).
    function drive(E, ux, uy) {
      try {
        var w = f.contentWindow, g = joyGeom();
        if (!g) { console.log('RIGPROBE drive: no zone'); return false; }
        if (!E) {
          if (joyOn) {
            g.zone.dispatchEvent(new w.PointerEvent('pointerup', {
              pointerId: 11, bubbles: true, cancelable: true, isPrimary: true, clientX: g.cx, clientY: g.cy
            }));
          }
          joyOn = false;
          console.log('RIGPROBE joy release');
          return true;
        }
        var dist = g.dead + rawOf(E) * (g.fullR - g.dead);
        if (!joyOn) {
          g.zone.dispatchEvent(new w.PointerEvent('pointerdown', {
            pointerId: 11, bubbles: true, cancelable: true, isPrimary: true, clientX: g.cx, clientY: g.cy
          }));
          joyOn = true;
          console.log('RIGPROBE joy press E=' + E + ' dir=' + ux + ',' + uy +
            ' px=' + dist.toFixed(1) + ' fullR=' + g.fullR.toFixed(1));
        }
        g.zone.dispatchEvent(new w.PointerEvent('pointermove', {
          pointerId: 11, bubbles: true, cancelable: true, clientX: g.cx + ux * dist, clientY: g.cy + uy * dist
        }));
        return true;
      } catch (e) { console.log('RIGPROBE drive err ' + e.message); return false; }
    }

    // sprint through the game's own SPRINT button (input.js bindButtons)
    function sprint(on) {
      try {
        var w = f.contentWindow, b = f.contentDocument.getElementById('btn-sprint');
        if (!b) { console.log('RIGPROBE sprint: no button'); return false; }
        b.dispatchEvent(new w.PointerEvent(on ? 'pointerdown' : 'pointerup', {
          pointerId: 12, bubbles: true, cancelable: true, isPrimary: true, clientX: 0, clientY: 0
        }));
        console.log('RIGPROBE sprint ' + (on ? 'on' : 'off'));
        return true;
      } catch (e) { console.log('RIGPROBE sprint err ' + e.message); return false; }
    }

    function forceKick() {
      var p = glbPlayer();
      if (!p) { console.log('RIGPROBE kick: no glb player'); return false; }
      p.kickAnim = 1;
      kickForced++;
      console.log('RIGPROBE glbKick forced #' + kickForced);
      return true;
    }

    // ---- state-driven script: each step acts once, then waits for the
    // controller to report the state it is supposed to reach ----
    function is(name) { return function (st) { return !!st && st.cur === name; }; }
    function wrapPi(a) {
      while (a > Math.PI) a -= Math.PI * 2;
      while (a < -Math.PI) a += Math.PI * 2;
      return a;
    }

    var steps = [
      { name: 'idle0', wait: is('idle') },
      { name: 'jog', act: function () { drive(0.40, 1, 0); }, wait: is('jog') },
      { name: 'run', act: function () { drive(0.75, 1, 0); }, wait: is('run') },
      { name: 'sprint', act: function () { sprint(true); }, wait: is('sprint') },
      { name: 'runBack', act: function () { sprint(false); }, wait: is('run') },
      // controller zeroes peak/stopT when kick starts, so the stick release
      // has to come off a run or 'stop' never arms
      { name: 'stop', act: function () { drive(0); }, wait: is('stop') },
      { name: 'idle1', wait: is('idle') },
      { name: 'kick', act: function () { forceKick(); }, wait: is('kick') },
      { name: 'turn', act: function () { drive(0.75, 0, 1); }, wait: is('run') },
      { name: 'turn2', act: function () { drive(0.75, 0, -1); },
        wait: function () { return stepTurn > 0.5; } },
      { name: 'stop2', act: function () { drive(0); }, wait: is('stop') },
      { name: 'idle2', wait: is('idle') }
    ];

    var STEP_TIMEOUT = 40, MAX_TICKS = 250, TICK_MS = 200;
    var tickN = 0, si = -1, stepTicks = 0, stepTurn = 0, lastFacing = null;
    var playAt = 0, doneScript = false, doneTick = 0;
    var joyOn = false, kickForced = 0, glbFails = 0, glbInfo = null;
    var glbSeen = {}, glbOrder = [], lastGlbState = '', maxTurn = 0;
    var timeouts = [];

    function enterStep() {
      si++;
      stepTicks = 0;
      stepTurn = 0;
      var s = steps[si];
      if (!s) return;
      console.log('RIGPROBE step[' + si + '/' + (steps.length - 1) + '] ' + s.name);
      if (s.act) { try { s.act(); } catch (e) { console.log('RIGPROBE step act err ' + e.message); } }
    }

    function counts() {
      return Object.keys(glbSeen).map(function (k) { return k + ':' + glbSeen[k]; }).join(' ');
    }

    function logLine() {
      var p = glbPlayer();
      var st = p && p.model.anim ? p.model.anim.state() : null;
      var ri = LG.debug && LG.debug.renderer && LG.debug.renderer.info;
      console.log('RIGPROBE n=' + tickN +
        ' match=' + (LG.Match && LG.Match.state) + '/' + (LG.Match ? LG.Match.clock : '-') +
        ' step=' + (steps[si] ? steps[si].name : '-') +
        ' glb=' + (p ? 1 : 0) + (st ? '/' + st.cur + '@' + st.time.toFixed(1) +
          ' sp=' + (st.spd || 0) + ' w=' + (st.weight || 0).toFixed(2) +
          ' kick=' + (st.kick || 0).toFixed(2) : '/-') +
        ' joy=' + (joyOn ? 1 : 0) + ' turn=' + maxTurn.toFixed(2) +
        ' states={' + counts() + '}' +
        ' glbAnimateChar=' + watcher.glb + ' animateChar=' + watcher.proc +
        ' fails=' + glbFails +
        (ri && ri.render ? ' calls=' + ri.render.calls + ' rtris=' + ri.render.triangles : ''));
    }

    function finish() {
      var p = glbPlayer();
      var st = p && p.model.anim ? p.model.anim.state() : null;
      console.log('RIGPROBE DONE ticks=' + tickN +
        ' playAt=' + playAt + ' scriptDone=' + (doneScript ? 1 : 0) +
        ' stepsDone=' + si + '/' + steps.length +
        ' states={' + counts() + '}' +
        ' order=' + glbOrder.join('>') +
        ' turnMax=' + maxTurn.toFixed(2) +
        ' kickForced=' + kickForced +
        ' glbAnimateChar=' + watcher.glb +
        ' animateCharProc=' + watcher.proc +
        ' fails=' + glbFails +
        ' timeouts=' + (timeouts.length ? timeouts.join(',') : 'none'));
      if (st) {
        console.log('RIGPROBE glbinfo ' + JSON.stringify({
          cur: st.cur, clips: st.clips, durs: st.durs, bob: st.bob, mapped: st.mapped,
          retarget: st.retarget, shim: st.shim, bias: st.bias,
          kickClip: st.kickClip, kickSpan: st.kickSpan, kickLen: st.kickLen,
          ground: st.ground, lift: st.lift, fails: st.fails, lastError: st.lastError
        }));
      } else {
        console.log('RIGPROBE glbinfo NONE');
      }
      console.log('RIGPROBE PROBE=' + (watcher.glb === 0 && glbFails === 0 && doneScript ? 'PASS' : 'CHECK'));
      stage('done');
    }

    function tick() {
      tickN++;
      var inPlay = !!(LG.Match && LG.Match.state === 'PLAY');
      var p = glbPlayer();
      var st = p && p.model.anim ? p.model.anim.state() : null;
      if (st) {
        glbSeen[st.cur] = (glbSeen[st.cur] || 0) + 1;
        if (st.cur !== lastGlbState) {
          glbOrder.push(st.cur);
          lastGlbState = st.cur;
          console.log('RIGPROBE glbstate ' + st.cur + ' t=' + st.time.toFixed(2) +
            ' sp=' + (st.spd || 0) + ' step=' + (steps[si] ? steps[si].name : '-'));
        }
        if (st.fails) glbFails = st.fails;
        if (!glbInfo) glbInfo = st;
        var fc = (p && typeof p.facing === 'number') ? p.facing : null;
        if (fc != null) {
          if (lastFacing != null) {
            var d = Math.abs(wrapPi(fc - lastFacing));
            stepTurn += d;
            if (d > maxTurn) maxTurn = d;
          }
          lastFacing = fc;
        }
      }
      if (inPlay && !playAt) { playAt = tickN; console.log('RIGPROBE playAt tick=' + tickN); enterStep(); }
      if (playAt && !doneScript) {
        if (!p && tickN > playAt + 15) {
          console.log('RIGPROBE NO GLB PLAYER — probe cannot run');
          doneScript = true; doneTick = tickN;
        } else {
          stepTicks++;
          var s = steps[si];
          if (s) {
            var ok = false;
            try { ok = s.wait(st); } catch (e) { ok = false; }
            if (!ok && stepTicks > STEP_TIMEOUT) {
              timeouts.push(s.name);
              console.log('RIGPROBE TIMEOUT step ' + s.name + ' (cur=' + (st ? st.cur : 'none') + ')');
            }
            if (ok || stepTicks > STEP_TIMEOUT) enterStep();
          } else { doneScript = true; doneTick = tickN; }
        }
      }
      if (tickN % 3 === 0) logLine();
      if (si >= steps.length && !doneScript) { doneScript = true; doneTick = tickN; }
      if (doneScript && tickN >= doneTick + 8) { finish(); return; }
      if (tickN >= MAX_TICKS) { finish(); return; }
      setTimeout(tick, TICK_MS);
    }
    setTimeout(tick, TICK_MS);
  }

  // ?rigtest=1 — drop the match flow entirely and line four characters up
  // for a close side view, so the player body itself (legs, boots, arms,
  // proportions) can be judged instead of a top-down match frame.
  // model 0 = idle, 1 + 2 = running, 3 = kicking.
  function rigTest() {
    var w = f.contentWindow, LG = w.LG;
    LG.Config.player.rig = 1;
    var d = f.contentDocument;
    ['menu-overlay', 'loading-overlay'].forEach(function (id) {
      try { d.getElementById(id).classList.add('hidden'); } catch (e) {}
    });
    var dbg = LG.debug;
    if (!dbg || !dbg.scene) { console.log('RIGTEST:no-scene'); stage('done'); return; }

    var ids = ['blaze', 'cannon', 'frenzy', 'stone'];
    var zs = [-2.1, -0.7, 0.7, 2.1];
    // clip + time each model is pinned to (frame-rate independent poses)
    var poses = [['idle', 0.8], ['run', 0.0], ['run', 0.31], ['kick', 0.26]];
    var lane = [], report = [];
    for (var i = 0; i < ids.length; i++) {
      var def = null;
      for (var k = 0; k < LG.Roster.length; k++) if (LG.Roster[k].id === ids[i]) def = LG.Roster[k];
      if (!def) { report.push(ids[i] + ':noroster'); continue; }
      try {
        var m = LG.Models.buildCharacter(def);
        m.group.scale.set(1.35, 1.35, 1.35);   // exactly what player.js applies
        m.group.position.set(0, 0, zs[i]);
        m.group.rotation.y = 0;                 // face +Z: we look from +Z
        dbg.scene.add(m.group);
        lane.push({ m: m, p: poses[i], f: 0 });
        report.push(ids[i] + ':' + (m.skinned ? 'skinned' : 'procedural') +
          ' parts=' + (m.group.children.length));
      } catch (e) { report.push(ids[i] + ':ERR ' + e.message); }
    }
    console.log('RIGTEST ' + report.join(' | '));

    var cam = dbg.camera;
    // the game's own loop keeps posing the camera, so pin ours from inside
    // renderer.render — the last word before the frame is drawn
    function pin() {
      cam.position.set(5.4, 1.15, 0);
      cam.lookAt(0, 0.85, 0);
      if (Math.abs(cam.fov - 45) > 0.01) { cam.fov = 45; cam.updateProjectionMatrix(); }
      cam.updateMatrixWorld(true);
    }
    try {
      var r = dbg.renderer, orig = r.render;
      r.render = function (sc, cm) { pin(); return orig.call(r, sc, cm); };
    } catch (e) { console.log('RIGTEST:renderwrap ' + e.message); }

    var FR = 0, T1 = w.performance.now();
    function frame() {
      FR++;
      pin();
      for (var i = 0; i < lane.length; i++) {
        var o = lane[i];
        o.f++;
        if (o.m.anim) o.m.anim.pose(o.p[0], o.p[1]);
      }
      w.requestAnimationFrame(frame);
    }
    w.requestAnimationFrame(frame);
    setTimeout(function () {
      console.log('RIGTEST frames=' + FR + ' elapsed=' +
        Math.round(w.performance.now() - T1) + ' vis=' + w.document.visibilityState +
        ' pvis=' + document.visibilityState);
      for (var i = 0; i < lane.length; i++) {
        var o = lane[i], L = o.m.limbs;
        console.log('RIGTEST pose ' + i +
          ' legR=' + (L ? L.legR.rotation.x.toFixed(2) : 'n/a') +
          ' legL=' + (L ? L.legL.rotation.x.toFixed(2) : 'n/a') +
          ' armL=' + (L ? L.armL.rotation.x.toFixed(2) : 'n/a') +
          ' anim=' + (o.m.anim ? JSON.stringify(o.m.anim.state()) : 'none'));
      }
    }, 700);
    setTimeout(function () { stage('done'); }, 900);
  }

  // ?glbtest=1 — Phase 2: one imported GLB footballer, close three-quarter
  // view, pinned to a retargeted clip (?glbpose=idle|jog|run|sprint|stop|kick
  // [ :t ]) so scale, grounding, facing, shadows and the pose can be judged
  // up close. ?glbpose=scan walks every clip instead.
  function fmtBox(b) {
    if (!b || !isFinite(b.min.y)) return 'none';
    var f = function (n) { return n.toFixed(3); };
    return '[' + b.min.toArray().map(f).join(',') + ']..[' + b.max.toArray().map(f).join(',') + ']' +
      ' h=' + (b.max.y - b.min.y).toFixed(3) + ' minY=' + f(b.min.y);
  }

  function glbTest() {
    var w = f.contentWindow, LG = w.LG;
    if (LG.RealPlayer && LG.RealPlayer.setLogging) LG.RealPlayer.setLogging(true);
    var watcher = watchAnimateChar(LG);
    var d = f.contentDocument;
    ['menu-overlay', 'loading-overlay'].forEach(function (id) {
      try { d.getElementById(id).classList.add('hidden'); } catch (e) {}
    });
    var dbg = LG.debug;
    if (!dbg || !dbg.scene) { console.log('GLBTEST:no-scene'); stage('done'); return; }
    if (!LG.RealPlayer) { console.log('GLBTEST:no-module'); stage('done'); return; }

    var parts = String(q.glbpose || 'idle').split(':');
    var poseName = parts[0] || 'idle';
    var dfltT = { kick: 1.0, stop: 0.31 }[poseName];
    if (dfltT == null) dfltT = 0.25;
    var poseT = parts.length > 1 ? Number(parts[1]) : dfltT;

    var t0 = w.performance.now(), tries = 0;
    (function go() {
      if (!LG.RealPlayer.ready()) {
        if (++tries > 100 || w.performance.now() - t0 > 15000) {
          console.log('GLBTEST:load-timeout status=' + JSON.stringify(LG.RealPlayer.status()));
          stage('done'); return;
        }
        setTimeout(go, 150); return;
      }
      var def = LG.Roster[0];
      var m;
      try { m = LG.RealPlayer.build(def); }
      catch (e) { console.log('GLBTEST:build-ERR ' + e.message); stage('done'); return; }
      if (!m) { console.log('GLBTEST:build-failed status=' + JSON.stringify(LG.RealPlayer.status())); stage('done'); return; }

      m.group.scale.set(1.35, 1.35, 1.35);   // exactly what player.js applies
      m.group.position.set(0, 0, 0);
      m.group.rotation.y = 0;                 // face +Z
      dbg.scene.add(m.group);

      var THREEx = w.THREE;
      function wp(re) {
        var hit = null;
        m.group.traverse(function (o) { if (!hit && o.isBone && re.test(o.name)) hit = o; });
        return hit;
      }
      var rest = {};
      ['footR', 'footL', 'handR', 'handL'].forEach(function (k) {
        var re = { footR: /^FootR/i, footL: /^FootL/i, handR: /^HandR/i, handL: /^HandL/i }[k];
        var b = wp(re);
        if (b) { rest[k] = b.getWorldPosition(new THREEx.Vector3()); }
      });

      m.anim.pose(poseName, poseT);

      var bindBox = new THREEx.Box3().setFromObject(m.group);
      var st0 = m.anim.state();
      console.log('GLBTEST model=glb pose=' + poseName + ':' + poseT +
        ' status=' + JSON.stringify(LG.RealPlayer.status()) +
        ' state=' + JSON.stringify(st0));
      // Box3.setFromObject ignores skinning (bind-pose geometry only) — the
      // skinned box below is what actually gets drawn
      console.log('GLBTEST skinnedBox(local)=' + fmtBox(LG.RealPlayer.box(false)) +
        ' skinnedBox(world)=' + fmtBox(LG.RealPlayer.box(true)) +
        ' bindBox=' + fmtBox(bindBox));
      var ri = dbg.renderer && dbg.renderer.info;
      if (ri && ri.render) {
        console.log('GLBTEST renderer calls=' + ri.render.calls + ' tris=' + ri.render.triangles +
          ' geometries=' + ri.memory.geometries + ' textures=' + ri.memory.textures);
      }
      console.log('GLBTEST limbs=' + ['legL', 'legR', 'armL', 'armR'].map(function (k) {
        return k + (m.limbs[k] ? '=' + m.limbs[k].name : '?MISSING');
      }).join(' ') +
        ' rest=' + Object.keys(rest).map(function (k) {
          return k + '[' + rest[k].toArray().map(function (n) { return n.toFixed(2); }).join(',') + ']';
        }).join(' '));

      var cam = dbg.camera;
      function pin() {
        cam.position.set(2.4, 1.5, 2.8);
        cam.lookAt(0, 1.0, 0);
        if (Math.abs(cam.fov - 45) > 0.01) { cam.fov = 45; cam.updateProjectionMatrix(); }
        cam.updateMatrixWorld(true);
      }
      try {
        var r = dbg.renderer, orig = r.render;
        r.render = function (sc, cm) { pin(); return orig.call(r, sc, cm); };
      } catch (e) { console.log('GLBTEST:renderwrap ' + e.message); }

      // ?glbpose=scan — walk every retargeted clip frame by frame and print
      // what the skeleton actually does (feet/hands travel + thigh swing),
      // so each cycle can be judged without guessing from one frame
      if (poseName === 'scan') {
        var tracks = ['footR', 'footL', 'toesR', 'toesL', 'handR', 'handL', 'head', 'hips'];
        var reOf = {
          footR: /^FootR/i, footL: /^FootL/i, handR: /^HandR/i, handL: /^HandL/i,
          toesR: /^ToesR/i, toesL: /^ToesL/i,
          head: /^Head_0?10|^Head/i, hips: /^Hips/i,
          legL: /^LegL/i, legR: /^LegR/i, calfL: /^CalfL/i, calfR: /^CalfR/i
        };
        var scanBones = {};
        Object.keys(reOf).forEach(function (k) {
          m.group.traverse(function (o) { if (!scanBones[k] && o.isBone && reOf[k].test(o.name)) scanBones[k] = o; });
        });
        var st0s = m.anim.state();
        var names = String(st0s.clips || '').split(',').filter(Boolean);
        console.log('GLBTEST scan clips=' + names.join(',') +
          ' durs=' + JSON.stringify(st0s.durs) +
          ' bob=' + st0s.bob + ' mapped=' + st0s.mapped +
          ' retarget=' + st0s.retarget + ' shim=' + st0s.shim +
          ' bias=' + JSON.stringify(st0s.bias) +
          ' kick=' + st0s.kickClip + ' span=' + st0s.kickSpan + ' len=' + st0s.kickLen +
          ' bones=' + Object.keys(scanBones).map(function (k) { return k + (scanBones[k] ? '=' + scanBones[k].name : '?'); }).join(' '));
        names.forEach(function (nm) {
          var dur = (st0s.durs && st0s.durs[nm]) || 0.5;
          var span = 0, minY = 1e9, maxSwing = 0;
          var step = Math.max(0.02, dur / 24);
          for (var t = 0; t <= dur + 1e-6; t += step) {
            if (!m.anim.pose(nm, t)) break;
            m.group.updateMatrixWorld(true);
            var stp = m.anim.state();
            var row = 'GLBSCAN ' + nm + ' t=' + t.toFixed(2);
            tracks.forEach(function (k) {
              if (!scanBones[k]) return;
              var p = scanBones[k].getWorldPosition(new THREEx.Vector3());
              row += ' ' + k + '=[' + p.x.toFixed(2) + ',' + p.y.toFixed(2) + ',' + p.z.toFixed(2) + ']';
              if (k.indexOf('foot') === 0 || k.indexOf('toes') === 0) { if (p.y < minY) minY = p.y; }
            });
            if (scanBones.legL) {
              row += ' legLx=' + scanBones.legL.rotation.x.toFixed(2) +
                ' legRx=' + (scanBones.legR ? scanBones.legR.rotation.x.toFixed(2) : '?') +
                ' calfLx=' + (scanBones.calfL ? scanBones.calfL.rotation.x.toFixed(2) : '?');
              var sw = Math.abs(scanBones.legL.rotation.x - scanBones.legR.rotation.x);
              if (sw > maxSwing) maxSwing = sw;
            }
            row += ' lift=' + (stp.lift || 0).toFixed(3) + ' rest=' + (stp.restFoot || 0).toFixed(3) +
              ' bobY=' + stp.bobY;
            console.log(row);
            span = t;
          }
          console.log('GLBSCAN ' + nm + ' span=' + span.toFixed(2) + ' dur=' + dur.toFixed(2) +
            ' minFootY=' + (isFinite(minY) ? minY.toFixed(3) : '?') +
            ' thighSwing=' + maxSwing.toFixed(2));
        });
        console.log('GLBTEST animateChar glb=' + watcher.glb + ' proc=' + watcher.proc);
        stage('done');
        return;
      }

      var FR = 0, TT = w.performance.now();
      (function frame() {
        FR++;
        pin();
      // default kick pose = the frame the boot swings through the ball
      if (parts.length < 2 && poseName === 'kick') {
        var ks = m.anim.state().kickStrike;
        if (ks > 0) poseT = ks;
      }

      m.anim.pose(poseName, poseT);
        w.requestAnimationFrame(frame);
      })();

      setTimeout(function () {
        var moved = Object.keys(rest).map(function (k) {
          var re = { footR: /^FootR/i, footL: /^FootL/i, handR: /^HandR/i, handL: /^HandL/i }[k];
          var bone = wp(re);
          var now = bone ? bone.getWorldPosition(new THREEx.Vector3()) : rest[k];
          return k + 'd=[' + now.clone().sub(rest[k]).toArray().map(function (n) { return n.toFixed(3); }).join(',') + ']';
        }).join(' ');
        console.log('GLBTEST frames=' + FR + ' elapsed=' + Math.round(w.performance.now() - TT) +
          ' vis=' + w.document.visibilityState + ' pvis=' + document.visibilityState +
          ' animateChar glb=' + watcher.glb + ' proc=' + watcher.proc +
          ' state=' + JSON.stringify(m.anim.state()) + ' ' + moved);
        stage('done');
      }, 900);
    })();
  }

  // ?scale=1 — Phase 3A: measure every player's REAL rendered size in a live
  // match (skinned world box + head/shoulder/foot markers), then park the GLB
  // player beside a procedural one for a side-by-side capture. Numbers first,
  // no guessing from the scale value.
  function scaleProbe() {
    var w = f.contentWindow, LG = w.LG, THREE = w.THREE;
    if (!THREE) { console.log('SCALE:no-three'); return; }
    if (!LG.Match || !LG.Match.all) { console.log('SCALE:no-match'); return; }
    var dbg = LG.debug;

    // true rendered extents: skinned vertices through their bones, plus the
    // ordinary meshes (hair/eyes ride the head bone, so matrixWorld covers them).
    // Also returns a TORSO band box (world y in [yLo,yHi]) so shoulder/chest
    // width can be compared without arm swing polluting the number.
    function worldBox(group, yLo, yHi) {
      var out = new THREE.Box3(), band = new THREE.Box3();
      var v = new THREE.Vector3(), any = false;
      group.updateMatrixWorld(true);
      group.traverse(function (o) {
        function push() {
          out.expandByPoint(v); any = true;
          if (v.y >= yLo && v.y <= yHi) band.expandByPoint(v);
        }
        if (o.isSkinnedMesh) {
          var pos = o.geometry && o.geometry.attributes && o.geometry.attributes.position;
          if (!pos) return;
          var step = Math.max(1, Math.ceil(pos.count / 5000));
          for (var i = 0; i < pos.count; i += step) {
            v.fromBufferAttribute(pos, i);
            if (o.boneTransform) o.boneTransform(i, v);
            v.applyMatrix4(o.matrixWorld);
            push();
          }
        } else if (o.isMesh && o.geometry) {
          if (!o.geometry.boundingBox) o.geometry.computeBoundingBox();
          var bb = o.geometry.boundingBox;
          if (!bb) return;
          for (var c = 0; c < 8; c++) {
            v.set(c & 1 ? bb.max.x : bb.min.x, c & 2 ? bb.max.y : bb.min.y, c & 4 ? bb.max.z : bb.min.z);
            v.applyMatrix4(o.matrixWorld);
            push();
          }
        }
      });
      return any ? { box: out, band: band } : null;
    }

    function bonePos(group, re) {
      var hit = null;
      group.traverse(function (o) { if (!hit && o.isBone && re.test(o.name)) hit = o; });
      return hit ? hit.getWorldPosition(new THREE.Vector3()) : null;
    }
    function n2(x) { return x == null || !isFinite(x) ? '?' : x.toFixed(3); }

    var players = LG.Match.all || [];
    var counts = { glb: 0, rig: 0, proc: 0 };
    var glb = null, gkGlb = null, others = [], glbList = [];
    // ?hidemat=Begue — drop one GLB material so the layer underneath shows:
    // the only reliable way to tell "shirt under the skin layer" from
    // "skin IS the shirt" on this asset
    if (q.hidemat) {
      try {
        for (i = 0; i < players.length; i++) {
          var hm = players[i] && players[i].model;
          if (!hm || !hm.glb) continue;
          hm.group.traverse(function (o) {
            if (!o.isMesh || !o.material) return;
            if ((o.material.name || '') === q.hidemat) {
              o.visible = false;
              console.log('HIDEMAT ' + o.name + ' mat=' + o.material.name);
            }
          });
        }
      } catch (e) { console.log('HIDEMAT err ' + e.message); }
    }
    // ?parts=1 — dye every GLB material a distinct flat colour, so one
    // screenshot says which mesh is shirt / shorts / helmet / boots
    if (q.parts === '1') {
      try {
        var HUES = [0xff0000, 0x00ff00, 0x0000ff, 0xffff00, 0xff00ff, 0x00ffff, 0xffffff];
        var hi = 0;
        for (i = 0; i < players.length; i++) {
          var pm2 = players[i] && players[i].model;
          if (!pm2 || !pm2.glb) continue;
          var pzi = players[i].z;
          pm2.group.updateWorldMatrix(true, true);
          pm2.group.traverse(function (o) {
            if (!o.isMesh || !o.material) return;
            var c = HUES[hi % HUES.length];
            // Phase 3A: the shirt mesh carries a material ARRAY (jersey|skin)
            var wasArr = Array.isArray(o.material);
            var src = wasArr ? o.material : [o.material];
            var out = [];
            for (var mi = 0; mi < src.length; mi++) {
              var m2 = (src[mi] && src[mi].clone) ? src[mi].clone() : src[mi];
              if (m2 && m2.color) m2.color.setHex(c);
              if (m2) { m2.map = null; m2.needsUpdate = true; }
              out.push(m2);
            }
            o.material = wasArr ? out : out[0];
            var zc = '';
            try {
              var bb = new THREE.Box3().setFromObject(o);
              if (!bb.isEmpty()) zc = ' zc=' + ((bb.min.z + bb.max.z) / 2 - pzi).toFixed(3);
            } catch (e) {}
            console.log('PARTS ' + o.name + ' mat=' + ((src[0] && src[0].name) || '?') +
              ' -> #' + c.toString(16) + zc);
            hi++;
          });
        }
      } catch (e) { console.log('PARTS err ' + e.message); }
    }
    // ?bands=1 — paint the GLB by BIND-POSE height bands (rainbow) so one
    // shot says exactly which y-range is torso / sleeves / hands / legs /
    // head: that is the map the kit tint has to key off
    if (q.bands === '1') {
      try {
        var BANDC = [0xff0000, 0xff8000, 0xffff00, 0x00ff00, 0x00ffff, 0x0000ff, 0xff00ff, 0xffffff];
        for (i = 0; i < players.length; i++) {
          var bm = players[i] && players[i].model;
          if (!bm || !bm.glb) continue;
          bm.group.traverse(function (o) {
            if (!o.isMesh || !o.geometry || !o.geometry.attributes || !o.geometry.attributes.position) return;
            var pos = o.geometry.attributes.position, n = pos.count;
            var col = new Float32Array(n * 3);
            for (var vi = 0; vi < n; vi++) {
              var yy = pos.getY(vi);
              var bi = Math.floor((yy + 0.05) / 1.5 * BANDC.length);
              if (bi < 0) bi = 0;
              if (bi >= BANDC.length) bi = BANDC.length - 1;
              var hex = BANDC[bi];
              col[vi * 3] = ((hex >> 16) & 255) / 255;
              col[vi * 3 + 1] = ((hex >> 8) & 255) / 255;
              col[vi * 3 + 2] = (hex & 255) / 255;
            }
            o.geometry.setAttribute('color', new THREE.BufferAttribute(col, 3));
            o.material = o.material.clone();
            o.material.vertexColors = true;
            o.material.color.setHex(0xffffff);
            o.material.map = null;
            o.material.needsUpdate = true;
            console.log('BANDS ' + o.name + ' verts=' + n);
          });
        }
        for (var bi2 = 0; bi2 < BANDC.length; bi2++) {
          var lo = -0.05 + bi2 * 1.5 / BANDC.length, hi = lo + 1.5 / BANDC.length;
          console.log('BANDS y[' + lo.toFixed(2) + ',' + hi.toFixed(2) + ')=#' + BANDC[bi2].toString(16));
        }
      } catch (e) { console.log('BANDS err ' + e.message); }
    }
    // controlled pose: force every model to its idle clip first so arm swing
    // / mid-run hair jitter cannot skew width or height between players
    for (i = 0; i < players.length; i++) {
      try {
        var pm = players[i] && players[i].model;
        if (pm && pm.anim && pm.anim.pose) pm.anim.pose('idle', 0.8);

  // Optional: ?ray=757,500;772,300 — raycast the live scene at those CSS
  // pixels and dump what is actually there to the Chrome console (shot.js
  // echoes CONSOLE lines), so a visual artifact can be identified by name.
  // ?sweep=1 does a grid sweep over the whole frame instead, run just before
  // the screenshot so both describe the same frame.
  var ARENA_CH = ['sky', 'ground', 'surface', 'goals', 'bleacher-1', 'bleacher+1',
    'sideSpect+1', 'sideSpect-1', 'buildings', 'props', 'graffiti', 'crosswalks',
    'barriers', 'lamps', 'benches', 'trees', 'vehicles', 'streetFurniture',
    'perimeterSpect', 'crowd', 'fenceH-1', 'fenceH+1', 'fenceV-1', 'fenceV+1'];

  function topInfo(o) {
    var t = o, p = o;
    var chain = [];
    while (p) { if (p.parent && p.parent === DBG.arena) break; p = p.parent; t = p; if (!p) break; }
    var idx = DBG.arena.children.indexOf(t);
    var g = o.geometry && o.geometry.type;
    return (idx >= 0 ? ARENA_CH[idx] || ('ch' + idx) : 'other') + '/' + (g || '-') + '/' + (o.name || '-');
  }

  var TARGETS = null;

  function buildTargets() {
    if (TARGETS) return TARGETS;
    console.log('PROBE:traverse-start ' + Date.now());
    var list = [], meshes = 0, tris = 0, inst = 0, bad = 0;
    DBG.scene.traverse(function (o) {
      if (!o.isMesh && !o.isPoints && !o.isLine) return;
      meshes++;
      var g = o.geometry;
      if (g && g.attributes && g.attributes.position) {
        var n = g.attributes.position.count;
        tris += (g.index ? g.index.count : n) / 3;
        if (g.attributes.position.count > 200000) bad++;
      }
      if (o.isInstancedMesh) inst += o.count;
      list.push(o);
    });
    TARGETS = list;
    console.log('SCENE meshes=' + meshes + ' tris=' + Math.round(tris) +
      ' instanced=' + inst + ' heavy=' + bad + ' list=' + list.length);
    return list;
  }

  function firstHit(rc) {
    var hits = rc.intersectObjects(buildTargets(), false);
    for (var i = 0; i < hits.length; i++) {
      var o = hits[i].object;
      if (o.visible === false) continue;
      var m = Array.isArray(o.material) ? o.material[0] : o.material;
      if (m && m.transparent && m.opacity < 0.35) continue;
      return hits[i];
    }
    return hits[0] || null;
  }

  function castPx(px, py, rc, r) {
    rc.setFromCamera({ x: (px - r.left) / r.width * 2 - 1, y: -((py - r.top) / r.height * 2 - 1) }, DBG.camera);
    var h = firstHit(rc);
    if (!h) return 'none';
    return topInfo(h.object) + ' @' + h.point.x.toFixed(1) + ',' + h.point.y.toFixed(1) + ',' + h.point.z.toFixed(1);
  }

  function raycast() {
    if (!q.ray && !q.sweep) return;
    console.log('PROBE:enter ' + Date.now());
    try {
      var w = f.contentWindow, THREE = w.THREE, LG = w.LG;
      var d = f.contentDocument;
      var cv = d.getElementById('game-canvas');
      var r = cv.getBoundingClientRect();
      var cam = LG.debug && LG.debug.camera;
      DBG = LG.debug;
      if (!cam) { console.log('RAY:no-debug'); return; }
      // the probe can run before the next render, so make sure the camera
      // matrices describe the pose we are about to sample
      cam.updateProjectionMatrix(); cam.updateMatrixWorld(true);
      // the scene graph can be rebuilt (court surface swap, props) after the
      // first probe pass — always re-collect the raycast targets and refresh
      // world matrices so the hits describe the frame we are looking at
      DBG.scene.updateMatrixWorld(true);
      TARGETS = null;
      buildTargets();
      console.log('RECT ' + JSON.stringify({l:Math.round(r.left),t:Math.round(r.top),w:Math.round(r.width),h:Math.round(r.height),vw:f.contentWindow.innerWidth,vh:f.contentWindow.innerHeight,asp:cam.aspect}));
      var t0 = performance.now();

          for (var x = 680; x <= 840; x += 2) {

        buf: [cv.width, cv.height], css: [cv.clientWidth, cv.clientHeight], rect: [Math.round(r.width), Math.round(r.height)]

      console.log('VDIR ' + vd0.toArray().map(function(n){return n.toFixed(3)}).join(',') +
        ' | ORG ' + org0.toArray().map(function(n){return n.toFixed(2)}).join(',') +
        ' | POS ' + cam.position.toArray().map(function(n){return n.toFixed(2)}).join(',') +
        ' | rot ' + cam.rotation.x.toFixed(3) + ',' + cam.rotation.y.toFixed(3) + ',' + cam.rotation.z.toFixed(3) +
        ' | up ' + cam.up.toArray().map(function(n){return n.toFixed(2)}).join(','));
      var pts = q.ray.split(';');
      for (var i = 0; i < pts.length; i++) {
        var ab = pts[i].split(',');
        var px = parseFloat(ab[0]), py = parseFloat(ab[1]);

        var all = rc.intersectObjects(buildTargets(), false);

          var o2 = all[q2].object, m2 = Array.isArray(o2.material) ? o2.material[0] : o2.material;
          desc.push(all[q2].distance.toFixed(2) + 'm ' + topInfo(o2) + ' pos' + o2.position.x.toFixed(1) + ',' + o2.position.y.toFixed(2) + ',' + o2.position.z.toFixed(1) + ' vis=' + o2.visible + '/' + (o2.parent ? o2.parent.visible : '?') + ' @' + all[q2].point.x.toFixed(1) + ',' + all[q2].point.y.toFixed(2) + ',' + all[q2].point.z.toFixed(1) +
            (m2 ? ' col#' + (m2.color ? m2.color.getHexString() : '') + (m2.transparent ? ' tr' + m2.opacity : '') + (m2.map ? ' map' : '') : ''));
        }
        console.log('HITS ' + px + ',' + py + ': ' + desc.join(' || '));
        var res = castPx(px, py, rc, r);
        console.log('RAY ' + px + ',' + py + ': ' + res + ' [t=' + Math.round(performance.now() - s0) + 'ms]');
        var el = d.elementFromPoint(px, py);
        console.log('DOM ' + px + ',' + py + ': ' + (el ? (el.tagName + '#' + el.id + ' cls=' + el.className + ' z=' + (d.defaultView.getComputedStyle(el).zIndex || '-')) : 'null'));
      }
      var cp2 = cam.position;
      console.log('CAM ' + cp2.x.toFixed(1) + ',' + cp2.y.toFixed(1) + ',' + cp2.z.toFixed(1) + ' fov=' + cam.fov.toFixed(1));

  // ?tex=1 - dump every textured ground/pitch material's image and look for
  // suspiciously dark rows/columns (a stray line drawn into a canvas texture).
  function scanImage(name, img, w, h) {
    try {
      var cv2 = d2canvas(w, h);
      var cx = cv2.getContext('2d');
      cx.drawImage(img, 0, 0, w, h);
      var data = cx.getImageData(0, 0, w, h).data;
      var eL = 0, eR = 0, eT = 0, eB = 0, t2;
      for (t2 = 0; t2 < h; t2++) { eL += lum(0, t2); eR += lum(w - 1, t2); }
      for (t2 = 0; t2 < w; t2++) { eT += lum(t2, 0); eB += lum(t2, h - 1); }
      eL /= h; eR /= h; eT /= w; eB /= w;
      function lum(x, y) { var i = (y * w + x) * 4; return 0.299 * data[i] + 0.587 * data[i + 1] + 0.114 * data[i + 2]; }
      var colMean = [], rowMean = [], i2, x, y, s;
      for (x = 0; x < w; x++) { s = 0; for (y = 0; y < h; y++) s += lum(x, y); colMean.push(s / h); }
      for (y = 0; y < h; y++) { s = 0; for (x = 0; x < w; x++) s += lum(x, y); rowMean.push(s / w); }
      function anomalies(arr, tag) {
        var out = [];
        for (var k = 1; k < arr.length - 1; k++) {
          var nb = (arr[k - 1] + arr[k + 1]) / 2;
          if (arr[k] < nb - 14) out.push(tag + k + ':' + arr[k].toFixed(0) + '<' + nb.toFixed(0));
        }
        return out.slice(0, 24);
      }
      console.log('TEX ' + name + ' ' + w + 'x' + h +
        ' | darkCols ' + anomalies(colMean, 'c').join(',') +
        ' | darkRows ' + anomalies(rowMean, 'r').join(',') +
        ' | edge dX=' + (eL - eR).toFixed(1) + ' dY=' + (eT - eB).toFixed(1) +
        ' L=' + eL.toFixed(0) + ' R=' + eR.toFixed(0) + ' T=' + eT.toFixed(0) + ' B=' + eB.toFixed(0));
    } catch (e) { console.log('TEX ' + name + ' ERR ' + e.message); }
  }
  function d2canvas(w, h) {
    var c2 = f.contentDocument.createElement('canvas');
    c2.width = w; c2.height = h;
    return c2;
  }

  function texProbe() {
    if (!q.tex) return;
    try {
      var THREE = f.contentWindow.THREE;
      DBG = f.contentWindow.LG.debug;
      var seen = 0;
      DBG.scene.traverse(function (o) {
        if (!o.isMesh || seen > 14) return;
        var m = Array.isArray(o.material) ? o.material[0] : o.material;
        if (!m || !m.map || !m.map.image) return;
        if (o.position.y > 1 || o.position.y < -1) return;
        var img = m.map.image;
        var w = img.width || img.naturalWidth, h = img.height || img.naturalHeight;
        if (!w || !h || w > 4096) return;
        seen++;
        var gp = new THREE.Vector3(); o.getWorldPosition(gp);
        var gg = o.geometry.parameters || {};
        scanImage((o.geometry && o.geometry.type) + '@y' + o.position.y.toFixed(2) +
          ' rep' + (m.map.repeat ? m.map.repeat.x + 'x' + m.map.repeat.y : '-') +
          ' wp(' + gp.x.toFixed(1) + ',' + gp.y.toFixed(2) + ',' + gp.z.toFixed(1) + ')' +
          ' dim=' + (gg.width || '?') + 'x' + (gg.height || '?') +
          ' vis=' + o.visible + ' parent=' + (o.parent ? (o.parent.name || o.parent.type) : '-') +
          ' side=' + m.side + ' col=#' + m.color.getHexString(), img, w, h);
      });
      if (!seen) console.log('TEX none');
    } catch (e) { console.log('TEX:ERR ' + e.message); }
  }

  // ?findz=-2.14 — list every mesh whose world bounding box crosses that
  // constant-z line near the ground, so a rendered artifact can be named.
  function findProbe() {
    if (q.findz === undefined || q.findz === '') return;
    try {
      var THREE = f.contentWindow.THREE;
      DBG = f.contentWindow.LG.debug;
      DBG.scene.updateMatrixWorld(true);
      var zc = Number(q.findz);
      var n = 0;
      DBG.scene.traverse(function (o) {
        if (!o.isMesh && !o.isLine && !o.isPoints) return;
        var bb = new THREE.Box3().setFromObject(o);
        if (!isFinite(bb.min.x)) return;
        if (bb.max.z < zc - 0.4 || bb.min.z > zc + 0.4) return;
        if (bb.max.y < -1 || bb.min.y > 6) return;
        var m = Array.isArray(o.material) ? o.material[0] : o.material;
        n++;
        if (n > 80) return;
        console.log('FIND ' + (n) + ' ' + o.geometry.type +
          ' x[' + bb.min.x.toFixed(1) + ',' + bb.max.x.toFixed(1) + ']' +
          ' y[' + bb.min.y.toFixed(2) + ',' + bb.max.y.toFixed(2) + ']' +
          ' z[' + bb.min.z.toFixed(2) + ',' + bb.max.z.toFixed(2) + ']' +
          ' dx=' + (bb.max.x - bb.min.x).toFixed(1) +
          ' dz=' + (bb.max.z - bb.min.z).toFixed(1) +
          ' vis=' + o.visible +
          ' mat=' + (m ? (m.type + (m.map ? '+map' : '') + '#' + m.color.getHexString() + ' t' + (m.transparent ? m.opacity : 1)) : '-') +
          ' parent=' + (o.parent ? (o.parent.name || o.parent.type) : '-'));
      });
      console.log('FIND done n=' + n);
    } catch (e) { console.log('FIND:ERR ' + e.message); }
  }

  // ?hide=asphalt,walk,slab,lines,logo — hide ground-plane layers by shape so
  // a rendered artifact can be attributed to the layer that draws it.
  function hideProbe() {
    if (!q.hide) return;
    try {
      var THREE = f.contentWindow.THREE;
      DBG = f.contentWindow.LG.debug;
      var want = q.hide.split(',');
      var n = 0;
      DBG.scene.traverse(function (o) {
        if (!o.isMesh && !o.isLine && !o.isPoints) return;
        var p = o.geometry && o.geometry.parameters;
        var m = o.material && (Array.isArray(o.material) ? o.material[0] : o.material);
        var hit = '';
        if (o.isLine || o.isPoints) hit = 'line';
        else if (p && o.geometry.type === 'PlaneGeometry') {
          if (p.width === 100 && p.height === 100) hit = 'asphalt';
          else if (p.width === 17) hit = 'walk';
          else if (p.width === 26 && p.height === 44) hit = (m && m.isMeshBasicMaterial) ? 'lines' : 'slab';
          else if (p.width === 10.4) hit = 'logo';
        }
        if (want.indexOf('all') >= 0 || (hit && want.indexOf(hit) >= 0)) {
          if (o.visible) { o.visible = false; n++; }
        }
      });
      console.log('HIDE ' + q.hide + ' -> ' + n);
    } catch (e) { console.log('HIDE:ERR ' + e.message); }
  }

  function startProbes() {
    if (q.noshadow) {
      try {
        var LGn = f.contentWindow.LG, rn = LGn.debug.renderer, sn = LGn.debug.scene;
        var nl = 0, nm = 0;
        sn.traverse(function (o) {
          if (o.isLight) { if (o.castShadow) nl++; o.castShadow = false; }
          if (o.material) {
            var arr = Array.isArray(o.material) ? o.material : [o.material];
            for (var i = 0; i < arr.length; i++) { arr[i].needsUpdate = true; nm++; }
          }
        });
        rn.shadowMap.enabled = false;
        console.log('NOSHADOW lights=' + nl + ' mats=' + nm);
      } catch (e) { console.log('NOSHADOW:ERR ' + e.message); }
    }
    if (q.tex) { texProbe(); stage('done'); return; }
    if (q.findz) { findProbe(); stage('done'); return; }
    if (q.hide) { hideProbe(); stage('done'); return; }
    if (!q.ray && !q.sweep) { stage('done'); return; }
    if (q.sweep) {
      // run the sweep as close to the capture instant as possible, so the
      // raycast and the PNG describe the same frame
      setTimeout(function () { raycast(); stage('done'); }, 0);
    } else {
      setTimeout(function () { raycast(); stage('done'); }, 300);
    }
  }

  f.addEventListener('load', function () { wait(booted, flow, 'booted'); });
  setTimeout(function () { wait(booted, flow, 'booted'); }, 1500); // belt and braces
})();
</script>
</body>
</html>
